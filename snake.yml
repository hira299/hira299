name: generate-snake-animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake animation (purple palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e0ccff&color_dots=#1a0b3d,#4b2e6b,#7b4fb5,#a374e0,#e0ccff
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e0ccff&color_dots=#1a0b3d,#4b2e6b,#7b4fb5,#a374e0,#e0ccff
            dist/github-contribution-grid-snake.gif?color_snake=#e0ccff&color_dots=#1a0b3d,#4b2e6b,#7b4fb5,#a374e0,#e0ccff&color_background=#0b0217
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
